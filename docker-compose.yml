services:
  api:
    build: .
    container_name: pimp_my_commander_api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PMC_BIND:-127.0.0.1}:8001:8001"
    volumes:
      - ./data:/code/data
      - ./app:/code/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001